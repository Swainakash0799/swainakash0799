name: Generate Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Run whenever main is updated
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Swainakash0799

          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%23161B22,%23164E63,%230E7490,%232563EB,%237C3AED
            dist/snake-light.svg?palette=github-light&color_snake=%230891B2&color_dots=%23EBEDF0,%23BAE6FD,%237DD3FC,%2338BDF8,%230369A1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}